    defines_pt: "O essencial é o cenário funcionar como uma pintura detalhada, com formas simplificadas, pinceladas aparentes e iluminação quente que organiza toda a imagem. A arquitetura recebe muitos pequenos elementos e variações de textura, enquanto vegetação, sombras e luz criam profundidade sem buscar realismo fotográfico. O resultado combina aconchego, nostalgia e sensação de lugar vivido."
