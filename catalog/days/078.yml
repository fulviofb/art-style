      - "soft watercolor"
      - "glossy 3D"
      - "highly detailed textures"
      - "pastel shading"
    avoid_why_pt: "Esses elementos suavizam demais a imagem e tiram o impacto gráfico, geométrico e contrastado que define o estilo."
