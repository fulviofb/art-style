  display_name: "Soviet Constructivist Poster Style"
  summary_pt: "Ilustração gráfica retrô: formas geométricas, sombras duras, paleta curta e textura de impressão gasta. Bom para movimento e ação; do cartaz construtivista do nome resta a paleta e o contraste, não a tipografia nem a montagem."
  summary_review: poster_checked
  reading:
    defines_pt: "O ponto-chave é a simplificação gráfica: personagens, veículos e arquitetura são construídos com formas limpas, blocos de cor e sombras bem marcadas. A paleta limitada, os contrastes fortes e a perspectiva exagerada dão energia cinematográfica, enquanto texturas de desgaste e impressão antiga acrescentam um acabamento retrô."
    prompt: "[seu tema], stylized retro graphic illustration, bold geometric shapes, simplified forms, strong graphic shadows, limited color palette, high contrast lighting, dynamic exaggerated perspective, clean flat planes, screen-printed poster texture, subtle distressed print marks, mid-century modern graphic design influence, cinematic composition"
