  summary_pt: "Anime de ambiente noturno, acolhedor e muito detalhado, com luz quente por dentro e azul profundo por fora. Bom para ateliês, bibliotecas, cafés e cenas contemplativas; não é ukiyo-e, as gravuras são objeto da cena, não a técnica."
  summary_review: poster_checked
  reading:
    defines_pt: "O essencial é o contraste entre iluminação interna quente e ambiente externo frio, mantendo tudo com acabamento de pintura de animação. A cena usa muitos pequenos objetos, madeira, papel, estantes e elementos decorativos para criar sensação de espaço vivido, enquanto a luz recorta volumes e conduz o olhar. A atmosfera é calma, artesanal e nostálgica, sem buscar realismo fotográfico."
