- id: handraw-157
  source_style_id: '157'
  source_style_name: 157 · Conceptual Line Drawing
  display_name: Conceptual Line Drawing
  family: editorial-poster
  tags:
  - editorial
  - minimal-line
  summary_pt: 'Linha fina e mínima a serviço de uma ideia: metáfora visual com quase nada. Bom para artigo, reflexão e post conceitual.'
  summary_review: poster_checked
  reading:
    defines_pt: Contorno fino e contínuo, muito espaço vazio e uma metáfora visual clara; um único toque de cor guia o olhar. A ideia vale mais que o detalhe.
    prompt: '[seu tema], conceptual minimalist line drawing, thin continuous black contour, clear visual metaphor, generous negative space, a single small accent of color, clean white background, editorial illustration'
    avoid:
    - detailed rendering
    - busy background
    - shading
    avoid_why_pt: Detalhe e fundo cheio escondem a metáfora, que precisa ser lida em um segundo.
    descriptors:
    - conceptual line art
    - visual metaphor illustration
    - minimalist editorial
    alt_pt: Perfil de cabeça com um lago no topo, onde uma pessoa pesca um coração vermelho.
    tested: false
    status: draft
  example:
    source_url: https://github.com/yang0/handraw-style/blob/70bf51d6b4c301805dd6c083355a2ad18db1023b/images/individual/001-200/157.png
