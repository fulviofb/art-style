  source_style_name: 156 · Loose Ink
  display_name: Loose Ink
  family: comics-graphic-novel
  tags:
  - ink-drawing
  - action
  summary_pt: 'Nanquim solto e rápido: traço grosso, respingos e muita energia. Bom para movimento, esporte e cenas urbanas.'
  summary_review: poster_checked
  reading:
    defines_pt: Pinceladas de nanquim rápidas e secas, com respingos e falhas que mostram a velocidade do gesto. Só preto sobre branco; o movimento vem do traço, não da cor.
    prompt: '[seu tema], loose black ink illustration, fast expressive brush strokes, dry-brush breaks and ink splatters, black ink on white paper only, energetic gestural drawing, strong sense of motion'
    avoid:
    - color fill
    - smooth vector lines
    - 3D render
    avoid_why_pt: Cor e linha limpa apagam o gesto rápido, que é todo o estilo.
    descriptors:
    - loose ink
    - gestural ink sketch
    - ink splatter drawing
    alt_pt: Skatista de boné saltando com o skate, em nanquim com respingos.
    tested: false
    status: draft
  example:
    source_url: https://github.com/yang0/handraw-style/blob/70bf51d6b4c301805dd6c083355a2ad18db1023b/images/individual/001-200/156.png
