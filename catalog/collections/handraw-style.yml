- id: handraw-155
  source_style_id: '155'
  source_style_name: 155 · Editorial Doodle
  display_name: Editorial Doodle
  family: editorial-poster
  tags:
  - editorial
  - doodle
  - ink-drawing
  summary_pt: 'Rabisco editorial: linha preta solta, poucas cores chapadas e fundo branco. Bom para post explicativo e ilustração de texto.'
  summary_review: poster_checked
  reading:
    defines_pt: Linha preta fina e um pouco trêmula sobre fundo branco, com duas ou três cores chapadas só nos pontos de atenção. O desenho é simples e amigável, feito para acompanhar uma ideia, não para ser um quadro.
    prompt: '[seu tema], editorial doodle illustration, loose thin black ink line, slightly wobbly hand-drawn contour, two or three flat accent colors, lots of white space, simple friendly shapes, clean white background'
    avoid:
    - 3D render
    - photorealistic
    - heavy shading
    avoid_why_pt: Sombreado e volume tiram a leveza de rabisco que faz o estilo funcionar ao lado de um texto.
    descriptors:
    - editorial doodle
    - hand-drawn line illustration
    - spot color doodle
    alt_pt: Moça pensativa diante de um notebook, com planta, caneca e uma lâmpada acesa ao lado.
    tested: false
    status: draft
  example:
    source_url: https://github.com/yang0/handraw-style/blob/70bf51d6b4c301805dd6c083355a2ad18db1023b/images/individual/001-200/155.png
