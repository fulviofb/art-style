source_id: curadoria
copy_policy: own_notes_only
# Estilos que a curadoria descreve a partir de referências observadas fora da série.
# Regra da coleção: a descrição e a paleta são autorais; a imagem observada não entra no repositório
# nem no site. Quando o estilo tiver uma imagem própria, gerada com o prompt da ficha, ela pode virar exemplo.
entries:
  - id: flat-vector-picture-book
    display_name: Flat Vector Picture Book
    naming_basis: curator_inference
    family: storybook-illustration
    tags:
      - storybook
      - children
      - flat-vector
      - geometric
    observed_in_pt: "Estilo observado em um livro infantil impresso, fotografado pela curadoria para estudo. As ilustrações originais são de seus autores e não são reproduzidas aqui: a imagem desta ficha foi gerada pela própria curadoria."
    summary_pt: "Ilustração infantil em vetor chapado: formas geométricas arredondadas, cor cheia sem contorno e personagens de olhos enormes, com espirais e marquinhas de movimento. Boa para histórias para crianças pequenas, cartazes e material didático."
    summary_review: poster_checked
    example:
      own_work: true
      poster_url: assets/img/flat-vector-picture-book.webp
      caption: "Imagem gerada pela própria curadoria, no estilo descrito nesta ficha."
      date_utc: "2026-09-25"
    palette:
      - hex: "#F4F5EF"
        name_pt: Branco-papel
        role_pt: fundo e nuvens
      - hex: "#5EA9E0"
        name_pt: Azul-céu
        role_pt: céu e água rasa
      - hex: "#2E5596"
        name_pt: Azul-profundo
        role_pt: água funda e noite
      - hex: "#CCDC4E"
        name_pt: Verde-limão
        role_pt: grama e folhagem
      - hex: "#709854"
        name_pt: Verde-folha
        role_pt: tom escuro do verde
      - hex: "#E8A97A"
        name_pt: Laranja-areia
        role_pt: pele e pelo
      - hex: "#E4D257"
        name_pt: Amarelo-sol
        role_pt: luz e detalhes
      - hex: "#97569B"
        name_pt: Roxo-uva
        role_pt: acento e cenas de fim de tarde
      - hex: "#D1799C"
        name_pt: Rosa-doce
        role_pt: acento quente
      - hex: "#3A3034"
        name_pt: Marrom quase preto
        role_pt: manchas, olhos e texto
    palette_note_pt: "Cores medidas nas fotos do material impresso, com o branco do papel corrigido: são referência para montar a sua paleta, não a especificação gráfica do original. Mais do que os códigos exatos, vale a relação entre eles — base alegre de azul, verde-limão e caramelo; dois ou três acentos de rosa, roxo e amarelo; ameixa quase preto no lugar do preto; branco de respiro. Uma geração digital neste estilo costuma sair mais saturada do que a página impressa."
    reading:
      defines_pt: "Tudo é construído com poucas formas geométricas arredondadas — círculos, ovais e retângulos de canto redondo — preenchidas com cor chapada. Não existe contorno em volta das formas; o escuro aparece só como detalhe interno, em traço fino ou em peça cheia, como cascos, chifres e perninhas de passarinho. E esse escuro é um ameixa quase preto, nunca preto puro, o que mantém o desenho macio. A profundidade vem da sobreposição das camadas e de um único tom mais escuro da mesma cor: não há degradê, textura de pincel nem sombra realista. Volta e meia aparece uma espiral — nas manchas, no sol, nas antenas — e pequenas marcas de movimento, tracinhos e trilhas pontilhadas, que dão espontaneidade sem sujar o acabamento. O fundo permanece largo e vazio, com silhuetas simples atrás do assunto, e a paleta é curta, saturada sem ser neon. A expressão mora no rosto: olhos ovais enormes com um único brilho branco. Se o seu tema não é personagem e não deve ganhar rosto, tire do prompt o trecho \"friendly character faces with oversized oval eyes and a single white highlight\" — nesta linguagem até objeto costuma ganhar olhos."
      prompt: "[seu tema], playful children's picture book illustration, flat vector style, simple rounded geometric shapes, bold flat color fills with no outlines around shapes, selective very dark plum linework for small details, one slightly darker tone of the same color for depth, overlapping layered shapes, spiral and swirl motifs, small hand-drawn motion marks and dashed trails, friendly character faces with oversized oval eyes and a single white highlight, short saturated palette of sky blue, lime green, orange tan and purple, generous empty background, clean modern early-reader aesthetic"
      avoid:
        - "black outlines"
        - "gradients"
        - "complex shading"
        - "realistic anatomy"
        - "textured brush strokes"
        - "3D render"
        - "photorealistic"
      avoid_why_pt: "Contorno em volta das formas, degradê, sombra elaborada e anatomia correta são exatamente o que este estilo não tem: a forma chapada perde o corte limpo e a expressão exagerada some assim que a IA acrescenta volume, pincelada ou proporção realista."
      descriptors:
        - "flat vector children's book illustration"
        - "playful picture book cartoon"
        - "geometric character design"
        - "early reader picture book art"
        - "expressive kids illustration"
        - "modern children's book vector"
      tested: false
      status: approved
  - id: textured-gouache-picture-book
    display_name: Textured Gouache Picture Book
    naming_basis: curator_inference
    family: storybook-illustration
    tags:
      - storybook
      - children
      - textured
      - painterly
    observed_in_pt: "Estilo observado em um exemplar de “Yara e as Cores” (Leiturinha), fotografado pela curadoria para estudo. A ilustração é de seus autores e não é reproduzida aqui; a ficha descreve a linguagem visual, não indexa o ilustrador."
    summary_pt: "Livro infantil com textura de papel: formas simples e arredondadas, pintura chapada tipo guache com grão visível e paleta quente e terrosa. Boa para histórias acolhedoras, narrativas sensíveis e material com clima artesanal."
    summary_review: poster_checked
    example:
      own_work: true
      poster_url: assets/img/textured-gouache-picture-book.webp
      caption: "Imagem gerada pela própria curadoria a partir da referência observada."
      date_utc: "2026-09-25"
    palette:
      - hex: "#E7BD4E"
        name_pt: Amarelo-mostarda
        role_pt: base quente, capa e fundos
      - hex: "#EFD48C"
        name_pt: Amarelo-claro
        role_pt: variação de luz no fundo
      - hex: "#F1E8D6"
        name_pt: Creme
        role_pt: página, nuvens e respiro
      - hex: "#B24F3F"
        name_pt: Vermelho-telha
        role_pt: roupas, títulos e acentos
      - hex: "#D8A5A8"
        name_pt: Rosa-queimado
        role_pt: fundos delicados e cenas afetivas
      - hex: "#79873F"
        name_pt: Verde-oliva
        role_pt: folhagem e objetos
      - hex: "#B6C39A"
        name_pt: Verde-sálvia
        role_pt: folhas claras e elementos leves
      - hex: "#B5734F"
        name_pt: Pele-canela
        role_pt: personagens
      - hex: "#55372E"
        name_pt: Marrom-cacau
        role_pt: cabelo e contraste
      - hex: "#64615E"
        name_pt: Cinza-grafite
        role_pt: texto e sombras
    palette_note_pt: "Cores medidas nas fotos do material impresso, com o branco do papel corrigido, e conferidas contra uma imagem digital no mesmo estilo. A lógica importa mais que os códigos: base de amarelos quentes com creme, acentos narrativos em telha e rosa queimado, apoio orgânico em oliva e sálvia, contraste em marrom e cinza no lugar do preto. É paleta de pouco contraste, acolhedora, sem o brilho saturado do desenho televisivo."
    reading:
      defines_pt: "O essencial é que a imagem não parece vetor liso: sobre o preenchimento chapado existe grão de papel visível, as bordas são macias e o acabamento lembra guache impresso. As formas são arredondadas e simplificadas, com volume sugerido por pouquíssimas variações de tom e um leve rubor nas bochechas, nunca por sombra elaborada. A composição respira, com bastante espaço vazio e poucos elementos de fundo, e a paleta é quente, terrosa e de pouco contraste — o escuro é marrom ou cinza, não preto. A textura é do estilo e não da fotografia: medida em área chapada, ela é cerca de três vezes mais forte do que no Flat Vector Picture Book, que é o irmão liso desta mesma família. A expressão vem dos olhos grandes e das sobrancelhas. Se o seu tema não é personagem, tire do prompt o trecho \"friendly character faces with large expressive eyes\"."
      prompt: "[seu tema], textured children's picture book illustration, warm handcrafted storybook aesthetic, gouache-like flat painting, visible grainy paper texture, soft edges, simplified rounded forms, gentle organic shapes, subtle print-like imperfections, muted earthy palette of mustard yellow, terracotta red and olive green, generous empty background, cozy editorial picture book mood, friendly character faces with large expressive eyes"
      avoid:
        - "glossy vector"
        - "neon colors"
        - "hyper-detailed shading"
        - "3D render"
        - "photorealistic"
      avoid_why_pt: "Esses termos devolvem a imagem ao acabamento digital que este estilo evita. Vetor brilhante e cor neon apagam o grão e a suavidade impressa, que são justamente o encanto daqui."
      descriptors:
        - "textured children's book illustration"
        - "handcrafted picture book art"
        - "gouache kids illustration"
        - "grainy storybook illustration"
        - "editorial children's picture book"
        - "warm naive illustration"
      tested: false
      status: approved
