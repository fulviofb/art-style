source_id: curadoria
copy_policy: own_notes_only
# Estilos que a curadoria descreve a partir de referências observadas fora da série.
# Regra da coleção: a descrição e a paleta são autorais; a imagem observada não entra no repositório
# nem no site. Quando o estilo tiver uma imagem própria, gerada com o prompt da ficha, ela pode virar exemplo.
entries:
  - id: flat-vector-picture-book
    display_name: Flat Vector Picture Book
    naming_basis: curator_inference
    family: storybook-illustration
    tags:
      - storybook
      - children
      - flat-vector
      - geometric
    observed_in_pt: "Livro infantil impresso, fotografado pela curadoria para estudo. As ilustrações originais são de seus autores e não são reproduzidas aqui."
    summary_pt: "Ilustração infantil em vetor chapado: formas geométricas arredondadas, cor cheia sem contorno e camadas sobrepostas no lugar de sombra. Boa para histórias para crianças pequenas, cartazes e material didático."
    summary_review: poster_checked
    palette:
      - hex: "#F4F5EF"
        name_pt: Branco-papel
        role_pt: fundo e nuvens
      - hex: "#5EA9E0"
        name_pt: Azul-céu
        role_pt: céu e água rasa
      - hex: "#2E5596"
        name_pt: Azul-profundo
        role_pt: água funda e noite
      - hex: "#CCDC4E"
        name_pt: Verde-limão
        role_pt: grama e folhagem
      - hex: "#709854"
        name_pt: Verde-folha
        role_pt: tom escuro do verde
      - hex: "#E8A97A"
        name_pt: Laranja-areia
        role_pt: pele e pelo
      - hex: "#E4D257"
        name_pt: Amarelo-sol
        role_pt: luz e detalhes
      - hex: "#97569B"
        name_pt: Roxo-uva
        role_pt: acento e cenas de fim de tarde
      - hex: "#D1799C"
        name_pt: Rosa-doce
        role_pt: acento quente
      - hex: "#3A3034"
        name_pt: Marrom quase preto
        role_pt: manchas, olhos e texto
    palette_note_pt: "Cores medidas nas fotos do material impresso, com o branco do papel corrigido. São valores de referência para montar a sua paleta, não a especificação gráfica do original."
    reading:
      defines_pt: "Tudo é construído com poucas formas geométricas arredondadas — círculos, ovais e retângulos de canto redondo — preenchidas com cor chapada e sem contorno. A profundidade vem da sobreposição das camadas e de um único tom mais escuro da mesma cor: não há degradê, textura de pincel nem sombra realista. O fundo permanece largo e vazio, com silhuetas simples atrás do assunto, e a paleta é saturada mas curta, quatro ou cinco cores por página. Se o tema tiver personagem, é o rosto que carrega a expressão: acrescente ao prompt \"oversized oval eyes with a single white highlight\"."
      prompt: "[seu tema], flat vector children's picture book illustration, simple rounded geometric shapes, bold flat color fills without outlines, one slightly darker tone of the same color for depth, overlapping layered shapes, crisp cut-paper edges, short saturated palette of sky blue, lime green, orange tan and purple, generous empty background, clean modern early-reader aesthetic"
      avoid:
        - "black outlines"
        - "gradients"
        - "textured brush strokes"
        - "3D render"
        - "photorealistic"
      avoid_why_pt: "Contorno, degradê e textura são exatamente o que este estilo não tem: a forma chapada perde o corte limpo assim que a IA acrescenta volume, pincelada ou brilho."
      descriptors:
        - "flat vector children's book illustration"
        - "geometric flat illustration"
        - "early reader picture book art"
        - "cut-paper style kids illustration"
        - "modern children's book vector"
      tested: false
      status: draft
